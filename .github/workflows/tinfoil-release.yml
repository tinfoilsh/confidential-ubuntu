# Tinfoil Containers image release workflow.
#
# Trigger this workflow from a branch via "Run workflow" and provide the
# version. It builds and publishes the image, then creates a source
# release containing local config examples pinned to the image digest.

name: Tinfoil Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: tinfoil-container-release-${{ inputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # checkout + check the tag does not exist
      packages: write   # push the container image
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Check if version tag already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$VERSION" =~ $VERSION_PATTERN ]]; then
            echo "::error::Version must have the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          tag_exists=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$VERSION" \
            --jq 'any(.[]; .ref == ("refs/tags/" + env.VERSION))')
          if [[ "$tag_exists" == true ]]; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the source tag and release

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - name: Publish the image digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          sed -i "s|^    image: .*|    image: \"$IMAGE@$DIGEST\"|" tinfoil-config*.yaml.example
          printf 'Image: %s@%s\n' "$IMAGE" "$DIGEST" > release-notes.md
          gh release create "$VERSION" tinfoil-config*.yaml.example \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md

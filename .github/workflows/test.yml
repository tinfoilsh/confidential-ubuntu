name: Test Ubuntu workspace

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: |
          scripts=(entrypoint.sh rootfs/healthcheck.sh)
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck -x "${scripts[@]}"
          python3 -m py_compile rootfs/usr/local/bin/workspace-unlock
      - name: Build image
        run: docker build -t confidential-ubuntu:test .
      - name: Check sshd config and root login policy
        run: |
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/host-ssh.pem"
          docker run --rm --entrypoint /bin/bash \
            -v "$RUNNER_TEMP/host-ssh.pem:/run/tinfoil/keys/host-ssh/private_key.pem:ro" \
            confidential-ubuntu:test -c \
            'mkdir -p /run/sshd && source /entrypoint && install_attested_host_key && /usr/sbin/sshd -t'
          docker run --rm --entrypoint /bin/bash confidential-ubuntu:test -c \
            'grep -qx "HostKey /etc/ssh/ssh_host_attested_key" /etc/ssh/sshd_config && grep -qx "PermitRootLogin prohibit-password" /etc/ssh/sshd_config'
          if docker run --rm --entrypoint /bin/bash confidential-ubuntu:test -c \
            'source /entrypoint && install_attested_host_key'; then
            echo 'expected missing host-ssh key to fail' >&2
            exit 1
          fi

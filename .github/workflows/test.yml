name: Test Ubuntu workspace

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: |
          scripts=(entrypoint.sh rootfs/healthcheck.sh rootfs/usr/local/bin/tailscale-join rootfs/usr/local/bin/tinfoil-identity-token)
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck -x "${scripts[@]}"
          python3 -m py_compile rootfs/usr/local/bin/workspace-unlock
      - name: Build image
        run: docker build -t confidential-ubuntu:test .
      - name: Check sshd config and root login policy
        run: |
          docker run --rm --entrypoint /bin/bash confidential-ubuntu:test -c '
            source /entrypoint
            mkdir -p /run/sshd "$(dirname "$HOST_KEY")"
            ssh-keygen -q -t ecdsa -b 256 -m PEM -N "" -f "$HOST_KEY"
            SSH_KEYS=$(cat "$HOST_KEY.pub")
            export SSH_KEYS
            configure
            diff /run/authorized_keys <(printf "%s\n" "$SSH_KEYS")
            /usr/sbin/sshd -t
            if (SSH_KEYS= configure); then exit 1; fi
            if (SSH_KEYS=invalid configure); then exit 1; fi
            test ! -e "$TELEPORT_CONFIG"
            TELEPORT_PROXY=example.teleport.sh:443 configure
            grep -Fx "  proxy_server: \"example.teleport.sh:443\"" "$TELEPORT_CONFIG"
            test ! -e "$TAILSCALE_UP_ARGS_FILE"
            TAILSCALE_UP_ARGS="--hostname=example --ssh" configure
            grep -Fx -- "--hostname=example --ssh" "$TAILSCALE_UP_ARGS_FILE"
            if (TAILSCALE_UP_ARGS="--auth-key=secret" configure); then exit 1; fi
            if (TAILSCALE_UP_ARGS="--client-id=example" configure); then exit 1; fi
            if (IDENTITY_ISSUER_URL=http://id.example.com configure); then exit 1; fi
            test ! -e "$TAILSCALE_FEDERATED_FILE"
            IDENTITY_ISSUER_URL=https://id.example.com/ TAILSCALE_UP_ARGS="--client-id=example" configure
            grep -Fx "https://id.example.com" "$IDENTITY_ISSUER_FILE"
            test -e "$TAILSCALE_FEDERATED_FILE"
          '
          docker run --rm --entrypoint /bin/bash confidential-ubuntu:test -c \
            'grep -qx "PermitRootLogin prohibit-password" /etc/ssh/sshd_config'

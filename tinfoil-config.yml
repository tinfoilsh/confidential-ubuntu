# An Ubuntu workspace with measured CVM-wide administrator access. Connect with
# `tinfoil ssh`, which tunnels over the shim's attested TLS.
cvm-version: 0.14.8
cpus: 8
memory: 32768
gpus: 1

networks:
  dev:
    egress: open          # needed for apt and pip

containers:
  - name: "workspace"
    image: "ghcr.io/tinfoilsh/confidential-ubuntu@sha256:b64ce753d6b33c3c5c2e792f14d8e02e4efba7b3fedb658ae98edc1fd5d37f9b" # v0.3.1
    runtime: nvidia
    gpus: all
    restart: on-failure
    cvm_admin: true
    stop_signal: SIGRTMIN+3
    stop_timeout: 120
    networks: [dev]

    # SSH, reachable only through the enclave's attested tunnel, never directly.
    # The shim tunnels CONNECT only to ports published here.
    ports: ["2022:2222"]

    # Inline, so the authorized key is measured rather than set on the deployment.
    env:
      - SSH_KEYS: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJaKZDsrzaJsxvNLjiy/7GdrO2M3J1EVZC4/azKTbOxH"

    tmpfs:
      /run: "rw,nosuid,nodev,mode=755"

    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

shim:
  # Unused: this workspace serves no HTTP API, but the field has to be set.
  upstream-port: 2222
  # Require a Tinfoil API key before the enclave will open a tunnel at all.
  authenticated: true

# An Ubuntu workspace with measured CVM-wide administrator access.
cvm-version: 0.14.8
cpus: 120
memory: 1048576
gpus: 8

networks:
  dev:
    egress: open

containers:
  - name: "workspace"
    image: "ghcr.io/tinfoilsh/confidential-ubuntu@sha256:b9cedcfeaab75c4dadee32431c3bc67b0328d409fe316084f36405782524b0f5" # v0.4.0
    runtime: nvidia
    gpus: all
    restart: on-failure
    cvm_admin: true
    stop_signal: SIGRTMIN+3
    stop_timeout: 120
    networks: [dev]

    ports: ["2022:2222"]

    env:
      - SSH_KEYS: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJaKZDsrzaJsxvNLjiy/7GdrO2M3J1EVZC4/azKTbOxH"

    tmpfs:
      /run: "rw,nosuid,nodev,mode=755"

    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

shim:
  upstream-port: 2222
  authenticated: false

# An Ubuntu workspace with measured CVM-wide administrator access. Connect with
# `tinfoil ssh`, which tunnels over the shim's attested TLS.
cvm-version: 0.14.8
cpus: 8
memory: 32768

networks:
  dev:
    egress: open          # needed for apt and pip

containers:
  - name: "workspace"
    image: "ghcr.io/tinfoilsh/confidential-ubuntu@sha256:e0cd50c669d3f8ee969598bae711bf19a192d4b26159b08fddb36b0947297886" # v0.2.0
    restart: on-failure
    cvm_admin: true
    stop_signal: SIGRTMIN+3
    stop_timeout: 120
    networks: [dev]

    # SSH, reachable only through the enclave's attested tunnel, never directly.
    # The shim tunnels CONNECT only to ports published here.
    ports: ["2022:2222"]

    # Inline, so the authorized key is measured rather than set on the deployment.
    env:
      - SSH_KEYS: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJaKZDsrzaJsxvNLjiy/7GdrO2M3J1EVZC4/azKTbOxH joe@corpy"

    tmpfs:
      /run: "rw,nosuid,nodev,mode=755"

    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

    # For a GPU box add `runtime: nvidia` and `gpus: all`, and set the top-level
    # `gpus:` to the attested count.

shim:
  # Unused: this workspace serves no HTTP API, but the field has to be set.
  upstream-port: 2222
  # Require a Tinfoil API key before the enclave will open a tunnel at all.
  authenticated: true

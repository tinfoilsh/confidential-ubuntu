# An Ubuntu workspace with measured CVM-wide administrator access. Connect with
# `tinfoil ssh`, which tunnels over the shim's attested TLS.
cvm-version: 0.14.8
cpus: 8
memory: 32768

networks:
  dev:
    egress: open          # needed for apt and pip

volumes:
  - name: workspace
    # Persistent encrypted disk, opened at boot with the 64-byte key in this secret.
    exec: true
    key-secret: WORKSPACE_VOLUME_KEY

containers:
  - name: "workspace"
    image: "ghcr.io/tinfoilsh/confidential-ubuntu@sha256:b3f574bb27ffb6ff59c997cea6a2385cf6ad40f5b2e5eb209d0771f8190d5abb" # v0.1.0
    restart: always
    cvm_admin: true
    stop_timeout: 30
    networks: [dev]
    volumes: [workspace:/mnt/disk]

    # SSH, reachable only through the enclave's attested tunnel, never directly.
    ports: ["2022:2222"]

    env:
      - SSH_AUTHORIZED_KEYS
      - SSH_HOST_KEY

    tmpfs:
      /run: "rw,nosuid,nodev,mode=755"

    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 2s

    # For a GPU box add `runtime: nvidia` and `gpus: 1`, and set the top-level
    # `gpus:` to the attested count.

shim:
  # Unused: this workspace serves no HTTP API, but the field has to be set.
  upstream-port: 2222
  # Require a Tinfoil API key before the enclave will open a tunnel at all.
  authenticated: true
